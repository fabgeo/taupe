<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070A">
<title>Taupe</title>
<meta name="description" content="Taupe : le jeu du mot secret entre amis, en ligne sans compte ou sur un seul téléphone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column under a warm spotlight on a black stage; the secret word is a small slip inside the flow.
   Single deliberate dark look, as asked: black everywhere. */
:root {
  color-scheme: dark;
  --bg: #07070A; --surface: #111117; --raise: #1A1A22; --line: #272731; --ink: #F3F1EA; --muted: #8F8D9B;
  --accent: #F5B83D; --accent-ink: #150E02; --glow: rgba(245, 184, 61, .28);
  --mask: #FF4D8D; --civil: #3FD8AE; --ghost: #AB9CFF;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
}
html, body { min-height: 100%; }
body { background: radial-gradient(900px 520px at 50% -180px, rgba(245, 184, 61, .13), transparent 65%),
    radial-gradient(700px 500px at 110% 110%, rgba(255, 77, 141, .07), transparent 60%), var(--bg);
  background-attachment: fixed; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 56px; }
#app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2.2rem, 9vw, 3rem); font-weight: 900; letter-spacing: -0.03em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: .9rem; font-weight: 500; letter-spacing: .01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.label { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--muted); }
.panel { background: linear-gradient(180deg, rgba(255,255,255,.025), transparent 40%), var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 160px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

input[type=text] { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 13px; width: 100%; box-sizing: border-box; }
input[type=text]::placeholder { color: #5D5B68; }
input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
input.code { font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .3em; font-weight: 700; }
button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; border: 1.5px solid var(--line); padding: 12px 16px; color: var(--ink); background: var(--raise); }
button:hover:not(:disabled) { border-color: #3A3A47; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 24px -8px var(--glow); }
button.primary:hover:not(:disabled) { border-color: #FFD27A; background: #FFC75A; }
button.ghost { background: transparent; }
button.danger { background: var(--mask); border-color: var(--mask); color: #1A0510; }
button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--mask); font-weight: 700; font-size: .9rem; }
a.btn { font-weight: 700; text-align: center; text-decoration: none; border-radius: 10px; border: 1.5px solid var(--line); padding: 12px 16px; color: var(--ink); background: var(--raise); }
a.btn:hover { border-color: #3A3A47; }
a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.linkbox { font-family: var(--f-mono) !important; font-size: .8rem !important; color: var(--muted) !important; }
.invite { background: rgba(245,184,61,.1); border: 1px solid rgba(245,184,61,.4); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.invite b { color: var(--accent); font-family: var(--f-mono); letter-spacing: .15em; }

/* Home */
.brand { display: flex; flex-direction: column; gap: 10px; padding: 14px 0 6px; }
.brand .logo { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 46px; height: 46px; flex: none; }
.brand h1 .c { color: var(--accent); }
.modes { display: grid; gap: 12px; }
.mode-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .8rem; }
.divider::before, .divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.rules { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; font-size: .9rem; align-items: baseline; }
.tag { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px;
  border: 1px solid currentColor; color: var(--muted); white-space: nowrap; line-height: 1.3; }
.tag.civil { color: var(--civil); }
.tag.uc { color: var(--mask); }
.tag.ghost { color: var(--ghost); }
.tag.host { color: var(--accent); }

/* Room bar */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar .code { font-family: var(--f-mono); font-weight: 700; letter-spacing: .22em; font-size: 1.05rem; color: var(--ink); }
.bar button { padding: 7px 12px; font-size: .85rem; }
.bigcode { font-family: var(--f-mono); font-weight: 700; font-size: 2.6rem; letter-spacing: .32em; color: var(--accent); text-shadow: 0 0 28px var(--glow); }

/* Players */
.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.players li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.players li:first-child { border-top: 0; }
.players .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.players .x { padding: 4px 10px; font-size: .8rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--civil); box-shadow: 0 0 10px var(--civil); flex: none; }
.dot.off { background: #4A4855; box-shadow: none; }

/* Settings */
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .settings { grid-template-columns: 1fr; } }
.set { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 6px; }
.set .ctl { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.set .val { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.set button { width: 38px; height: 38px; padding: 0; font-size: 1.2rem; line-height: 1; }
.set .hint { font-size: .78rem; color: var(--muted); }

/* Secret word slip: deliberately small */
.slip { align-self: flex-start; width: 100%; max-width: 260px; border: 1.5px dashed #3A3A46; background: var(--surface); border-radius: 12px;
  padding: 11px 15px; text-align: left; display: flex; flex-direction: column; gap: 2px; font-weight: 400; }
.slip .word { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.slip.hidden .word { letter-spacing: .25em; color: #4D4B58; }
.slip.shown { border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(245,184,61,.08), 0 10px 30px -12px var(--glow); }
.slip.shown .word { color: var(--accent); }
.slip.ghostslip.shown { border-color: var(--ghost); box-shadow: 0 0 0 4px rgba(171,156,255,.08); }
.slip.ghostslip.shown .word { color: var(--ghost); }
.slip .sub { font-size: .76rem; color: var(--muted); }

.status { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.status .label b { color: var(--ink); }

/* Pass the device */
.pass { text-align: center; padding: 30px 18px; align-items: center; }
.pass .who { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.8rem, 8vw, 2.4rem); color: var(--accent); overflow-wrap: anywhere; }
.pass .slip { align-self: center; text-align: center; align-items: center; }
.progress { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.progress i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.progress i.done { background: var(--accent); }

/* Clue board */
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.board li { display: grid; grid-template-columns: minmax(80px, 34%) 1fr; gap: 10px; align-items: baseline; padding: 9px 11px; border-radius: 10px; background: var(--bg); border: 1px solid transparent; }
.board li.turn { border-color: var(--accent); box-shadow: 0 0 22px -10px var(--glow); }
.board li.out { opacity: .5; }
.board li.out .who { text-decoration: line-through; }
.board .who { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.board .clues { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.board .clue { font-family: var(--f-mono); font-size: .85rem; font-weight: 500; background: var(--raise); padding: 1px 8px; border-radius: 6px; overflow-wrap: anywhere; }
.board .clue.now { background: rgba(245,184,61,.14); color: var(--accent); }
.board .pending { color: var(--muted); font-size: .85rem; }

/* Votes */
.votes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.votes button { text-align: left; background: var(--bg); overflow-wrap: anywhere; display: flex; justify-content: space-between; gap: 6px; }
.votes button.mine { border-color: var(--mask); color: var(--mask); box-shadow: 0 0 20px -8px var(--mask); }
.votes .n { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }

.reveal { text-align: center; padding: 28px 18px; align-items: center; }
.reveal .big { font-family: var(--f-display); font-size: clamp(1.5rem, 7vw, 2rem); font-weight: 900; overflow-wrap: anywhere; }
.win-civils { color: var(--civil); text-shadow: 0 0 30px rgba(63,216,174,.3); }
.win-imposteurs { color: var(--mask); text-shadow: 0 0 30px rgba(255,77,141,.3); }
.win-ghost { color: var(--ghost); text-shadow: 0 0 30px rgba(171,156,255,.3); }

.words { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .words { grid-template-columns: 1fr; } }
.words div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
.words b { font-family: var(--f-display); display: block; overflow-wrap: anywhere; }
.words .c b { color: var(--civil); } .words .u b { color: var(--mask); } .words .g b { color: var(--ghost); }

.scores { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.scores li { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.scores li:last-child { border-bottom: 0; }
.scores .rank { font-family: var(--f-mono); color: var(--muted); width: 2ch; }
.scores .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.scores .pts { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.scores li.first .pts, .scores li.first .rank, .scores li.first .name { color: var(--accent); }

@media (prefers-reduced-motion: no-preference) {
  .slip, button { transition: border-color .15s, background-color .15s, box-shadow .2s, transform .1s; }
  button:active:not(:disabled) { transform: scale(.98); }
  .screen { animation: rise .28s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
.netbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: rgba(255,77,141,.1); border: 1px solid rgba(255,77,141,.45); border-radius: 10px; padding: 8px 10px 8px 14px; font-size: .9rem; }
.netbar button { padding: 7px 12px; font-size: .85rem; }
.champion { color: var(--accent); text-shadow: 0 0 30px var(--glow); }
</style>

<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } body { margin: 0; } [hidden] { display: none !important; }</style>

<body>
<div id="app"><p class="muted">Chargement…</p></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// [mot des civils, mot de la taupe, indice large pour le fantôme]
const PAIRS = [
  ["Chat","Chien","animal"],["Café","Thé","boisson"],["Plage","Piscine","loisir"],["Pizza","Burger","nourriture"],
  ["Guitare","Violon","musique"],["Avion","Hélicoptère","transport"],["Soleil","Lune","ciel"],["Instagram","TikTok","internet"],
  ["Netflix","YouTube","écran"],["Banane","Mangue","fruit"],["Ski","Snowboard","sport"],["Football","Rugby","sport"],
  ["Vampire","Zombie","monstre"],["Mariage","Anniversaire","fête"],["Médecin","Infirmier","métier"],["Pompier","Policier","métier"],
  ["Bière","Vin","boisson"],["Paris","Londres","ville"],["Harry Potter","Le Seigneur des anneaux","film"],["Lion","Tigre","animal"],
  ["Croissant","Pain au chocolat","boulangerie"],["Montagne","Colline","paysage"],["Pluie","Neige","météo"],["Train","Métro","transport"],
  ["Stylo","Crayon","école"],["Fourchette","Cuillère","cuisine"],["Lit","Canapé","maison"],["Douche","Bain","maison"],
  ["Requin","Dauphin","mer"],["Abeille","Guêpe","insecte"],["Chocolat","Caramel","sucré"],["Glace","Sorbet","dessert"],
  ["Noël","Halloween","fête"],["Roi","Prince","château"],["Pirate","Viking","histoire"],["Batman","Spider-Man","héros"],
  ["Mario","Sonic","jeu vidéo"],["Piano","Orgue","musique"],["Tennis","Badminton","sport"],["Basket","Volley","sport"],
  ["Sushi","Ramen","nourriture"],["Crêpe","Gaufre","nourriture"],["Fromage","Beurre","frigo"],["Lunettes","Lentilles","vue"],
  ["Montre","Bracelet","accessoire"],["Téléphone","Tablette","objet"],["Ordinateur","Console","objet"],["Forêt","Jungle","nature"],
  ["Désert","Savane","nature"],["Volcan","Geyser","nature"],["Château","Palais","bâtiment"],["Hôpital","Pharmacie","ville"],
  ["Boulanger","Pâtissier","métier"],["Magicien","Clown","spectacle"],["Cirque","Zoo","sortie"],["Cinéma","Théâtre","sortie"],
  ["Camping","Hôtel","vacances"],["Valise","Sac à dos","voyage"],["Tente","Cabane","abri"],["Moto","Scooter","route"],
  ["Vélo","Trottinette","route"],["Ketchup","Mayonnaise","sauce"],["Pâtes","Riz","féculent"],["Tomate","Poivron","légume"],
  ["Fraise","Framboise","fruit"],["Citron","Orange","fruit"],["Dragon","Dinosaure","créature"],["Sorcière","Fée","conte"],
  ["Licorne","Pégase","créature"],["Hiver","Automne","saison"],["Matin","Soir","moment"],["Bougie","Lampe","lumière"],
  ["Parapluie","Imperméable","pluie"],["Écharpe","Bonnet","hiver"],["Baskets","Bottes","chaussures"],["Coiffeur","Barbier","métier"],
  ["Astronaute","Pilote","métier"],["Fusée","Satellite","espace"],["Étoile","Planète","espace"],["Popcorn","Chips","apéro"]
];
const ROLE_LABEL = { civil: "Civil", uc: "Taupe", ghost: "Fantôme" };
const POINTS = { civil: 2, uc: 10, ghost: 6 };
const DEFAULT_SETTINGS = { uc: 1, ghost: 0, manches: 3, tours: 2 };
const PEER_PREFIX = "taupe-fabgeo-";
const PEER_OPTS = window.PEER_OPTS || { debug: 0 };
const LOCAL_HOST = "host";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }
function lsSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
function randomCode() { const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return Array.from({ length: 4 }, () => L[Math.floor(Math.random() * L.length)]).join(""); }

/* ================= Game engine =================
   Runs on the host's device (online) or on the shared device (local).
   Every change goes through apply(G, actor, action). */
function freshRoom(code, host) {
  return { code, host, status: "lobby", settings: { ...DEFAULT_SETTINGS }, manche: 0, scores: {}, usedPairs: [],
    players: {}, clues: [], votes: [], inRound: [], order: [], alive: [] };
}
const listPlayers = G => Object.values(G.players).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
function startProblem(G) {
  const n = listPlayers(G).length, s = G.settings, imp = s.uc + s.ghost;
  if (n < 3) return "Il faut au moins 3 joueurs.";
  if (imp < 1) return "Mets au moins 1 Taupe ou 1 Fantôme.";
  if (n - imp <= imp) return `Trop d'imposteurs pour ${n} joueurs : il faut plus de civils que de Taupes et de Fantômes.`;
  return "";
}
function startManche(G, local) {
  const s = G.settings, ids = shuffle(listPlayers(G).map(p => p.uid));
  if ((G.usedPairs || []).length >= PAIRS.length) G.usedPairs = [];
  const free = PAIRS.map((_, i) => i).filter(i => !G.usedPairs.includes(i));
  const pi = free[Math.floor(Math.random() * free.length)];
  G.usedPairs.push(pi);
  let [a, b, hint] = PAIRS[pi];
  if (Math.random() < .5) [a, b] = [b, a];
  const roles = {};
  ids.forEach((id, i) => { roles[id] = { role: i < s.uc ? "uc" : i < s.uc + s.ghost ? "ghost" : "civil" }; });
  let order = shuffle(ids);
  const firstOk = order.findIndex(id => roles[id].role !== "ghost");
  order = order.slice(firstOk).concat(order.slice(0, firstOk));
  ids.forEach(id => { if (G.scores[id] == null) G.scores[id] = 0; });
  Object.assign(G, { status: local ? "deal" : "clues", deal: 0, manche: G.manche + 1, cycle: 1, tour: 1, speaker: 0,
    order, alive: order.slice(), inRound: ids, roles, words: { civil: a, uc: b, hint }, lastOut: null, winner: null });
}
function advance(G) {
  G.speaker++;
  if (G.speaker >= G.order.length) { G.speaker = 0; G.tour++; }
  if (G.tour > G.settings.tours) { G.status = "vote"; G.tour = G.settings.tours; G.speaker = 0; }
}
function winnerFor(G) {
  const imp = G.alive.filter(id => G.roles[id]?.role !== "civil").length, civ = G.alive.length - imp;
  if (imp === 0) return "civils";
  if (civ <= imp) return "imposteurs";
  return null;
}
function endManche(G, winner, ghostUid) {
  Object.entries(G.roles).forEach(([id, { role }]) => {
    let p = 0;
    if (winner === "civils" && role === "civil") p = POINTS.civil;
    if (winner === "imposteurs" && role !== "civil") p = POINTS[role];
    if (winner === "ghost" && id === ghostUid) p = POINTS.ghost;
    G.scores[id] = (G.scores[id] || 0) + p;
  });
  G.winner = winner; G.status = "roundEnd";
}
function eliminate(G, out) {
  const role = G.roles[out].role;
  G.alive = G.alive.filter(id => id !== out); G.order = G.order.filter(id => id !== out);
  G.lastOut = { uid: out, role };
  if (role === "ghost") { G.status = "ghostGuess"; return; }
  const w = winnerFor(G);
  if (w) endManche(G, w); else G.status = "result";
}
function resolveVotes(G) {
  const tally = {};
  G.votes.filter(v => v.manche === G.manche && v.cycle === G.cycle && G.alive.includes(v.uid))
    .forEach(v => { if (G.alive.includes(v.target)) tally[v.target] = (tally[v.target] || 0) + 1; });
  const max = Math.max(0, ...Object.values(tally));
  const top = Object.keys(tally).filter(k => tally[k] === max);
  if (top.length !== 1) { G.status = "result"; G.lastOut = { tie: true }; return; }
  eliminate(G, top[0]);
}
// Returns an error message for the actor, or "".
function apply(G, actor, a) {
  const host = actor === G.host, st = G.status;
  const str = v => String(v ?? "").trim().slice(0, 40);
  switch (a && a.type) {
    case "join": {
      const name = String(a.name || "").trim().slice(0, 20) || "Joueur";
      const p = G.players[actor];
      G.players[actor] = { uid: actor, name, joinedAt: p ? p.joinedAt : Date.now(), online: true };
      return "";
    }
    case "addLocal": {
      const name = String(a.name || "").trim().slice(0, 20);
      if (!name) return "";
      if (listPlayers(G).some(p => norm(p.name) === norm(name))) return "Ce prénom est déjà dans la liste.";
      const uid = "p" + rid(); G.players[uid] = { uid, name, joinedAt: Date.now(), online: true }; return "";
    }
    case "leave": if (!host) delete G.players[actor]; return "";
    case "kick": if (host && a.uid !== G.host) delete G.players[a.uid]; return "";
    case "set": {
      if (!host || st !== "lobby") return "";
      const lim = { uc: [0, 6], ghost: [0, 4], manches: [1, 10], tours: [1, 5] }[a.key];
      if (!lim) return "";
      G.settings[a.key] = Math.min(lim[1], Math.max(lim[0], (G.settings[a.key] || 0) + (a.delta > 0 ? 1 : -1)));
      return "";
    }
    case "start": {
      if (!host || st !== "lobby") return "";
      const p = startProblem(G); if (p) return p;
      startManche(G, !!a.local); return "";
    }
    case "dealNext":
      if (!host || st !== "deal") return "";
      if (G.deal + 1 >= G.order.length) { G.status = "clues"; G.deal = 0; } else G.deal++;
      return "";
    case "clue": {
      if (st !== "clues" || G.order[G.speaker] !== actor) return "Ce n'est pas ton tour.";
      const word = str(a.word); if (!word) return "Écris un mot avant d'envoyer.";
      G.clues = G.clues.filter(c => !(c.manche === G.manche && c.cycle === G.cycle && c.tour === G.tour && c.uid === actor));
      G.clues.push({ uid: actor, manche: G.manche, cycle: G.cycle, tour: G.tour, word });
      advance(G); return "";
    }
    case "skip": if (host && st === "clues") advance(G); return "";
    case "vote": {
      if (st !== "vote" || !G.alive.includes(actor) || !G.alive.includes(a.target) || a.target === actor) return "";
      G.votes = G.votes.filter(v => !(v.manche === G.manche && v.cycle === G.cycle && v.uid === actor));
      G.votes.push({ uid: actor, manche: G.manche, cycle: G.cycle, target: a.target });
      const n = G.votes.filter(v => v.manche === G.manche && v.cycle === G.cycle && G.alive.includes(v.uid)).length;
      if (n >= G.alive.length) resolveVotes(G);
      return "";
    }
    case "resolve": if (host && st === "vote") resolveVotes(G); return "";
    case "eliminate": if (host && st === "vote" && G.alive.includes(a.target)) eliminate(G, a.target); return "";
    case "guess": {
      if (st !== "ghostGuess" || G.lastOut?.uid !== actor) return "";
      const guess = str(a.guess); if (!guess) return "";
      G.lastOut = { ...G.lastOut, guess, right: norm(guess) === norm(G.words.civil) };
      if (G.lastOut.right) { endManche(G, "ghost", actor); return ""; }
      const w = winnerFor(G);
      if (w) endManche(G, w); else G.status = "result";
      return "";
    }
    case "continue": if (host && st === "result") Object.assign(G, { status: "clues", cycle: G.cycle + 1, tour: 1, speaker: 0 }); return "";
    case "next":
      if (!host || st !== "roundEnd") return "";
      if (G.manche >= G.settings.manches) G.status = "final"; else startManche(G, !!a.local);
      return "";
    case "newGame":
      if (!host) return "";
      Object.assign(G, { status: "lobby", manche: 0, scores: {}, clues: [], votes: [], inRound: [], order: [], alive: [],
        roles: null, words: null, lastOut: null, winner: null });
      return "";
  }
  return "";
}
// What one player is allowed to see: their own role and word, plus roles already revealed.
function viewFor(G, uid) {
  const v = clone(G);
  if (G.roles && !["roundEnd", "final"].includes(G.status)) {
    v.roles = {};
    for (const id in G.roles) if (id === uid || !G.alive.includes(id)) v.roles[id] = G.roles[id];
    const r = G.roles[uid]?.role, k = r === "ghost" ? "hint" : r;
    v.words = k ? { [k]: G.words[k] } : {};
  }
  return v;
}

const S = { mode: null, uid: lsGet("uc_uid") || rid(), pseudo: lsGet("uc_pseudo"), code: null, room: null,
  net: "idle", peer: null, conn: null, revealed: false, revealKey: "", dealReady: false, pick: null, err: "", copied: false,
  prefill: "", savedLocal: null, savedHost: null };
lsSet("uc_uid", S.uid);
let G = null;
const conns = new Map();
const app = document.getElementById("app");

const players = () => S.room ? Object.values(S.room.players).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0)) : [];
const nameOf = uid => S.room?.players[uid]?.name || "Joueur parti";
const isLocal = () => S.mode === "local";
const isHost = () => isLocal() || S.mode === "host";
const me = () => isLocal() ? null : S.uid;
const you = id => !isLocal() && id === S.uid ? " (toi)" : "";

function refresh() {
  if (!G) return;
  S.room = isLocal() ? clone(G) : viewFor(G, S.uid);
  render();
}
function persist() {
  if (isLocal()) lsSet("uc_local", JSON.stringify(G));
  if (S.mode === "host") lsSet("uc_hostgame", JSON.stringify({ at: Date.now(), G }));
}
function broadcast() {
  for (const [uid, c] of conns) if (c.open) { try { c.send({ t: "state", s: viewFor(G, uid) }); } catch {} }
}
// Every button goes through here. Host and local apply directly; guests ask the host.
function send(a) {
  S.err = "";
  if (S.mode === "guest") {
    if (S.conn && S.conn.open) S.conn.send({ t: "act", a });
    else { S.err = "Pas connecté au salon. Touche « Se reconnecter »."; render(); }
    return;
  }
  let actor = isLocal() ? LOCAL_HOST : S.uid;
  if (isLocal() && a.type === "clue") actor = G.order[G.speaker];
  if (isLocal() && a.type === "guess") actor = G.lastOut?.uid;
  const e = apply(G, actor, { ...a, local: isLocal() });
  if (e) S.err = e;
  persist(); broadcast(); refresh();
}

/* ================= Networking (PeerJS: the host's device is the server) ================= */
let wakeLock = null;
async function keepAwake() { try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {} }

function hostRoom(name, resume) {
  if (!window.Peer) { S.err = "Le module de connexion n'a pas chargé. Vérifie ta connexion internet."; render(); return; }
  closeNet();
  S.mode = "host"; S.net = "connecting"; S.err = "";
  const code = resume ? resume.code : randomCode();
  S.code = code; render();
  const peer = new Peer(PEER_PREFIX + code, PEER_OPTS); S.peer = peer;
  peer.on("open", () => {
    G = resume ? resume : freshRoom(code, S.uid);
    G.host = S.uid;
    Object.values(G.players).forEach(p => { if (p.uid !== S.uid) p.online = false; });
    apply(G, S.uid, { type: "join", name });
    S.net = "ok"; keepAwake(); persist(); refresh();
  });
  peer.on("connection", conn => {
    conn.on("data", msg => {
      if (!msg || typeof msg !== "object" || !G) return;
      if (msg.t === "hello") {
        const uid = String(msg.uid || "").slice(0, 40);
        if (!uid || uid === G.host) return;
        const old = conns.get(uid); if (old && old !== conn) { try { old.close(); } catch {} }
        conn.uid = uid; conns.set(uid, conn);
        apply(G, uid, { type: "join", name: msg.name });
      } else if (msg.t === "act" && conn.uid && G.players[conn.uid]) {
        const a = msg.a || {};
        if (["kick", "set", "start", "skip", "resolve", "continue", "next", "newGame", "eliminate", "dealNext", "addLocal"].includes(a.type)) return;
        const e = apply(G, conn.uid, a);
        if (e) { try { conn.send({ t: "err", m: e }); } catch {} }
        if (a.type === "leave") { conns.delete(conn.uid); setTimeout(() => { try { conn.close(); } catch {} }, 200); }
      } else return;
      persist(); broadcast(); refresh();
    });
    conn.on("close", () => {
      if (conn.uid && conns.get(conn.uid) === conn) {
        conns.delete(conn.uid);
        if (G?.players[conn.uid]) G.players[conn.uid].online = false;
        persist(); broadcast(); refresh();
      }
    });
  });
  peer.on("disconnected", () => { if (S.peer === peer && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch {} }, 1000); });
  peer.on("error", e => {
    if (S.peer !== peer) return;
    if (e.type === "unavailable-id") {
      if (resume) { S.net = "lost"; S.err = "Le salon met quelques secondes à se libérer. Réessaie « Reprendre mon salon » dans un instant."; closeNet(); S.mode = null; }
      else { hostRoom(name, null); return; }
    } else if (e.type === "peer-unavailable") return;
    else if (!G) { S.err = "Impossible d'ouvrir le salon (" + e.type + "). Vérifie ta connexion internet."; closeNet(); S.mode = null; }
    render();
  });
}
function kick(uid) {
  const c = conns.get(uid);
  if (c) { try { c.send({ t: "kicked" }); } catch {} conns.delete(uid); setTimeout(() => { try { c.close(); } catch {} }, 200); }
  send({ type: "kick", uid });
}
function joinRoom(code, name) {
  if (!window.Peer) { S.err = "Le module de connexion n'a pas chargé. Vérifie ta connexion internet."; render(); return; }
  closeNet();
  S.mode = "guest"; S.code = code; S.net = "connecting"; S.err = "";
  lsSet("uc_guest", code); render();
  const peer = new Peer(PEER_OPTS); S.peer = peer;
  const timer = setTimeout(() => {
    if (S.peer === peer && S.net === "connecting") { S.net = "lost"; S.err = `Impossible de joindre le salon ${code}. Vérifie le code, et que l'hôte a bien la page ouverte.`; render(); }
  }, 15000);
  peer.on("open", () => {
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true }); S.conn = conn;
    conn.on("open", () => { clearTimeout(timer); S.net = "ok"; S.err = ""; conn.send({ t: "hello", uid: S.uid, name }); keepAwake(); render(); });
    conn.on("data", msg => {
      if (S.conn !== conn || !msg) return;
      if (msg.t === "state") { S.room = msg.s; render(); }
      else if (msg.t === "err") { S.err = msg.m; render(); }
      else if (msg.t === "kicked") { leave(); S.err = "L'hôte t'a retiré·e du salon."; render(); }
    });
    conn.on("close", () => { if (S.conn === conn && S.mode === "guest") { S.net = "lost"; S.err = "Connexion avec l'hôte perdue."; render(); } });
  });
  peer.on("error", e => {
    if (S.peer !== peer) return;
    clearTimeout(timer); S.net = "lost";
    S.err = e.type === "peer-unavailable" ? `Aucun salon ${code} ouvert. Vérifie le code, ou l'hôte a fermé sa page.` : "Connexion impossible (" + e.type + ").";
    render();
  });
}
function closeNet() {
  for (const c of conns.values()) { try { c.close(); } catch {} }
  conns.clear();
  if (S.peer) { const p = S.peer; S.peer = null; try { p.destroy(); } catch {} }
  S.conn = null;
}
function leave() {
  if (S.mode === "guest" && S.conn?.open) { try { S.conn.send({ t: "act", a: { type: "leave" } }); } catch {} }
  if (S.mode === "host") lsSet("uc_hostgame", "");
  if (S.mode === "guest") lsSet("uc_guest", "");
  if (S.mode === "local") lsSet("uc_local", "");
  const p = S.peer; S.peer = null; S.conn = null;
  for (const c of conns.values()) { try { c.close(); } catch {} } conns.clear();
  setTimeout(() => { try { p && p.destroy(); } catch {} }, 300);
  Object.assign(S, { mode: null, code: null, room: null, net: "idle", pick: null, dealReady: false });
  G = null; loadSaved(); render();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  keepAwake();
  if (S.mode === "guest" && S.net === "lost" && S.code) joinRoom(S.code, S.pseudo);
  if (S.mode === "host" && S.peer && S.peer.disconnected && !S.peer.destroyed) { try { S.peer.reconnect(); } catch {} }
});

    <p class="small muted">Mémorise-le, cache-le, puis passe l'appareil.</p>
    <button class="primary" data-a="dealNext">${last ? "J'ai vu, on commence" : "J'ai vu, joueur suivant"}</button></div>`;
}
function viewClues() {
  const r = S.room, sp = currentSpeaker(), mine = isLocal() || sp === S.uid;
  return `${bar()}${statusLine()}${mySlip()}
  <div class="panel"><h2>${isLocal() ? `Au tour de ${esc(nameOf(sp))}` : mine ? "À toi de jouer" : `C'est au tour de ${esc(nameOf(sp))}`}</h2>
    ${isLocal() ? slip(sp, `clue${r.manche}-${r.cycle}-${r.tour}-${sp}`) : ""}
    ${mine ? `<div class="row"><input type="text" id="clueInput" class="grow" maxlength="40" placeholder="Ton indice en un mot" data-enter="clue" autocomplete="off">
      <button class="primary" data-a="clue">Envoyer</button></div>
      <p class="small muted">Ne donne pas le mot. Assez précis pour ton camp, assez vague pour piéger les autres.</p>` : ""}
    ${board()}
    ${isHost() && !(S.mode === "host" && mine) ? `<button class="ghost" data-a="skip">Passer ${esc(nameOf(sp))}</button>` : ""}
    ${errLine()}</div>`;
}
function viewVote() {
  const r = S.room;
  if (isLocal()) return `${bar()}${statusLine()}
  <div class="panel"><h2>Qui élimine-t-on ?</h2>
    <p class="small muted">Débattez, votez à main levée, puis touchez le joueur désigné.</p>
    <div class="votes">${r.alive.map(id => `<button data-a="vote" data-u="${esc(id)}" class="${S.pick === id ? "mine" : ""}"><span>${esc(nameOf(id))}</span></button>`).join("")}</div>
    <button class="danger" data-a="confirmVote" ${S.pick ? "" : "disabled"}>${S.pick ? `Éliminer ${esc(nameOf(S.pick))}` : "Choisis un joueur"}</button>
    ${errLine()}</div>
  <div class="panel"><h3>Les mots donnés</h3>${board()}</div>`;
  const vs = r.votes.filter(v => v.manche === r.manche && v.cycle === r.cycle && r.alive.includes(v.uid));
  const my = vs.find(v => v.uid === S.uid), can = r.alive.includes(S.uid), done = new Set(vs.map(v => v.uid));
  return `${bar()}${statusLine()}${mySlip()}
  <div class="panel"><div class="status"><h2>Vote</h2><span class="label"><b>${vs.length}</b> / ${r.alive.length} ont voté</span></div>
    <p class="small muted">${can ? "Qui est l'imposteur ? Le joueur le plus désigné est éliminé." : "Tu es éliminé·e ou spectateur. Regarde les autres voter."}</p>
    <div class="votes">${r.alive.filter(id => id !== S.uid).map(id => `<button data-a="vote" data-u="${esc(id)}" class="${my?.target === id ? "mine" : ""}" ${!can ? "disabled" : ""}>
      <span>${esc(nameOf(id))}</span><span class="n">${done.has(id) ? "a voté" : ""}</span></button>`).join("")}</div>
    ${isHost() ? `<button class="ghost" data-a="resolve" ${vs.length ? "" : "disabled"}>Dépouiller les votes maintenant</button>` : ""}
    ${errLine()}</div>
  <div class="panel"><h3>Les mots donnés</h3>${board()}</div>`;
}
function outLine(lo) {
  if (!lo || lo.tie) return `<p class="big">Égalité</p><p class="muted">Personne n'est éliminé. On repart pour un tour.</p>`;
  return `<p class="label">Éliminé·e</p><p class="big">${esc(nameOf(lo.uid))}</p>
    <p>C'était : <span class="tag ${lo.role}">${ROLE_LABEL[lo.role]}</span></p>
    ${lo.guess ? `<p class="muted">Le Fantôme a proposé « ${esc(lo.guess)} » : ${lo.right ? "bonne réponse !" : "raté."}</p>` : ""}`;
}
function viewResult() {
  return `${bar()}${statusLine()}${mySlip()}
  <div class="panel reveal stack">${outLine(S.room.lastOut)}</div>
  ${isHost() ? `<button class="primary" data-a="continue">Tour de parole suivant</button>` : `<p class="small muted">L'hôte relance la suite…</p>`}
  <div class="panel"><h3>Les mots donnés</h3>${board()}</div>`;
}
function viewGhostGuess() {
  const r = S.room, mine = isLocal() || r.lastOut.uid === S.uid;
  return `${bar()}${statusLine()}
  <div class="panel reveal stack"><p class="label">Éliminé·e</p><p class="big">${esc(nameOf(r.lastOut.uid))}</p>
    <p><span class="tag ghost">Fantôme</span></p>
    ${mine ? `<p>${isLocal() ? esc(nameOf(r.lastOut.uid)) + ", dernière chance" : "Dernière chance"} : devine le mot des civils.</p>
      <div class="row" style="width:100%"><input type="text" id="guessInput" class="grow" maxlength="40" placeholder="Le mot des civils" data-enter="guess" autocomplete="off">
      <button class="primary" data-a="guess">Valider</button></div>`
      : `<p class="muted">Le Fantôme tente de deviner le mot des civils…</p>`}
    ${errLine()}</div>
  <div class="panel"><h3>Les mots donnés</h3>${board()}</div>`;
}
function scoreList() {
  const sc = S.room.scores || {}, ids = Object.keys(sc).sort((a, b) => (sc[b] || 0) - (sc[a] || 0));
  return `<ul class="scores">${ids.map((id, i) => `<li class="${i === 0 ? "first" : ""}"><span class="rank">${i + 1}</span>
    <span class="name">${esc(nameOf(id))}${you(id)}</span><span class="pts">${sc[id] || 0} pts</span></li>`).join("")}</ul>`;
}
function viewRoundEnd() {
  const r = S.room, last = r.manche >= r.settings.manches;
  const title = { civils: "Les civils gagnent", imposteurs: "Les imposteurs gagnent", ghost: "Le Fantôme a deviné !" }[r.winner];
  return `${bar()}${statusLine()}
  <div class="panel reveal stack"><p class="big win-${r.winner}">${title}</p>${r.lastOut ? `<div class="stack">${outLine(r.lastOut)}</div>` : ""}</div>
  <div class="panel"><h3>Les mots de la manche</h3>
    <div class="words"><div class="c"><span class="label">Civils</span><b>${esc(r.words.civil)}</b></div>
      <div class="u"><span class="label">Taupe</span><b>${esc(r.words.uc)}</b></div>
      <div class="g"><span class="label">Indice Fantôme</span><b>${esc(r.words.hint)}</b></div></div>
    <ul class="players">${Object.entries(r.roles).map(([id, { role }]) => `<li><span class="name">${esc(nameOf(id))}${you(id)}</span><span class="tag ${role}">${ROLE_LABEL[role]}</span></li>`).join("")}</ul></div>
  <div class="panel"><h3>Scores</h3>${scoreList()}</div>
  ${isHost() ? `<button class="primary" data-a="next">${last ? "Voir le classement final" : "Manche suivante"}</button>` : `<p class="small muted">L'hôte lance la suite…</p>`}
  <div class="panel"><h3>Les mots donnés</h3>${board()}</div>`;
}
function viewFinal() {
  const sc = S.room.scores || {}, ids = Object.keys(sc).sort((a, b) => (sc[b] || 0) - (sc[a] || 0));
  return `${bar()}
  <div class="panel reveal stack"><p class="label">Fin de la partie · ${S.room.manche} manche${S.room.manche > 1 ? "s" : ""}</p>
    <p class="big champion">${ids.length ? esc(nameOf(ids[0])) + " gagne" : "Partie terminée"}</p></div>
  <div class="panel"><h3>Classement</h3>${scoreList()}</div>
  ${isHost() ? `<button class="primary" data-a="newGame">Nouvelle partie</button>` : `<p class="small muted">L'hôte peut relancer une nouvelle partie.</p>`}`;
}

let lastScreen = "";
function render() {
  const keep = ["pseudo", "joinCode", "clueInput", "guessInput", "newPlayer"].map(id => {
    const el = document.getElementById(id); return el ? [id, el.value, document.activeElement === el, el.selectionStart] : null;
  }).filter(Boolean);
  let html, screen;
  if (!S.mode) { html = viewHome(); screen = "home"; }
  else if (!S.room) {
    screen = "wait";
    html = `${bar()}<div class="panel reveal stack"><p class="big">${S.net === "lost" ? "Pas de connexion" : "Connexion au salon…"}</p>
      ${S.net === "lost" ? `${errLine()}<div class="row"><button class="primary" data-a="reconnect">Réessayer</button><button class="ghost" data-a="leave">Retour</button></div>` : `<p class="muted">Salon ${esc(S.code)}</p>`}</div>`;
  } else {
    screen = S.room.status + (S.room.status === "deal" ? S.room.deal + "" + S.dealReady : "");
    html = ({ lobby: viewLobby, deal: viewDeal, clues: viewClues, vote: viewVote, result: viewResult, ghostGuess: viewGhostGuess, roundEnd: viewRoundEnd, final: viewFinal }[S.room.status] || viewLobby)();
  }
  app.innerHTML = html;
  if (screen !== lastScreen) { app.classList.remove("screen"); void app.offsetWidth; app.classList.add("screen"); window.scrollTo(0, 0); }
  lastScreen = screen;
  keep.forEach(([id, val, focused, pos]) => {
    const el = document.getElementById(id); if (!el) return;
    if (id !== "joinCode" || val) el.value = val;
    if (focused) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
  });
}

function readPseudo() {
  const v = (document.getElementById("pseudo")?.value || "").trim().slice(0, 20);
  if (!v) { S.err = "Choisis un pseudo d'abord."; render(); return null; }
  S.pseudo = v; lsSet("uc_pseudo", v); return v;
}
function takeInput(id) { const el = document.getElementById(id); const v = (el?.value || "").trim(); if (el) el.value = ""; return v; }

const ACTIONS = {
  create: () => { const n = readPseudo(); if (n) hostRoom(n, null); },
  resumeHost: () => { const n = readPseudo(); if (n && S.savedHost) hostRoom(n, S.savedHost.G); },
  join: () => {
    const n = readPseudo(); if (!n) return;
    const code = (document.getElementById("joinCode")?.value || "").trim().toUpperCase();
    if (!/^[A-Z]{4}$/.test(code)) { S.err = "Le code fait 4 lettres."; render(); return; }
    joinRoom(code, n);
  },
  reconnect: () => S.code && joinRoom(S.code, S.pseudo || "Joueur"),
  leave,
  local: () => { closeNet(); S.mode = "local"; S.err = ""; S.code = null; G = freshRoom(null, LOCAL_HOST); persist(); refresh(); },
  resumeLocal: () => { closeNet(); S.mode = "local"; S.err = ""; G = S.savedLocal; persist(); refresh(); },
  addPlayer: () => { const n = takeInput("newPlayer"); if (n) send({ type: "addLocal", name: n }); document.getElementById("newPlayer")?.focus(); },
  kick: el => isLocal() ? send({ type: "kick", uid: el.dataset.u }) : kick(el.dataset.u),
  set: el => send({ type: "set", key: el.dataset.k, delta: +el.dataset.d }),
  start: () => send({ type: "start" }),
  dealReady: () => { S.dealReady = true; render(); },
  dealNext: () => { S.dealReady = false; send({ type: "dealNext" }); },
  reveal: () => { S.revealed = !S.revealed; render(); },
  clue: () => { const w = (document.getElementById("clueInput")?.value || "").trim(); if (!w) { S.err = "Écris un mot avant d'envoyer."; render(); return; } takeInput("clueInput"); send({ type: "clue", word: w }); },
  skip: () => send({ type: "skip" }),
  vote: el => { if (isLocal()) { S.pick = S.pick === el.dataset.u ? null : el.dataset.u; render(); } else send({ type: "vote", target: el.dataset.u }); },
  confirmVote: () => { const t = S.pick; S.pick = null; if (t) send({ type: "eliminate", target: t }); },
  resolve: () => send({ type: "resolve" }),
  guess: () => { const g = takeInput("guessInput"); if (g) send({ type: "guess", guess: g }); },
  continue: () => send({ type: "continue" }),
  next: () => send({ type: "next" }),
  newGame: () => send({ type: "newGame" }),
  copyLink: async () => {
    try { await navigator.clipboard.writeText(inviteText()); S.copied = true; render(); setTimeout(() => { S.copied = false; render(); }, 2000); }
    catch { const el = document.getElementById("inviteLink"); if (el) { el.focus(); el.select(); } }
  },
  share: async () => { try { await navigator.share({ title: "Taupe", text: `Rejoins ma partie de Taupe ! Salon ${S.code}`, url: inviteLink() }); } catch {} },
};
app.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  ACTIONS[el.dataset.a]?.(el);
});
app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const a = e.target.dataset?.enter; if (a) { e.preventDefault(); ACTIONS[a]?.(e.target); }
});

function loadSaved() {
  try { const l = JSON.parse(lsGet("uc_local") || "null"); S.savedLocal = l && l.status && l.status !== "final" ? l : null; } catch { S.savedLocal = null; }
  try { const h = JSON.parse(lsGet("uc_hostgame") || "null"); S.savedHost = h && h.G && Date.now() - h.at < 6 * 3600e3 ? h : null; } catch { S.savedHost = null; }
}
loadSaved();
const qRoom = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
S.prefill = /^[A-Z]{4}$/.test(qRoom) ? qRoom : "";
render();
</script>
</body>
</html>
