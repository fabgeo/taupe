<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Taupe</title>
<meta name="description" content="Taupe : le jeu du mot secret entre amis, en ligne sans compte ou sur un seul téléphone.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column under a warm spotlight on a black stage; the secret word is a small slip inside the flow.
   Single deliberate dark look, as asked: black everywhere. */
:root {
  color-scheme: dark;
  --bg: #07070A; --surface: #111117; --raise: #1A1A22; --line: #272731; --ink: #F3F1EA; --muted: #8F8D9B;
  --accent: #F5B83D; --accent-ink: #150E02; --glow: rgba(245, 184, 61, .28);
  --mask: #FF4D8D; --civil: #3FD8AE; --ghost: #AB9CFF;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px;
}
html, body { min-height: 100%; }
body { background: radial-gradient(900px 520px at 50% -180px, rgba(245, 184, 61, .13), transparent 65%),
    radial-gradient(700px 500px at 110% 110%, rgba(255, 77, 141, .07), transparent 60%), var(--bg);
  background-attachment: fixed; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 56px; }
#app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2.2rem, 9vw, 3rem); font-weight: 900; letter-spacing: -0.03em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: .9rem; font-weight: 500; letter-spacing: .01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.label { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--muted); }
.panel { background: linear-gradient(180deg, rgba(255,255,255,.025), transparent 40%), var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 160px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

input[type=text] { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 13px; width: 100%; box-sizing: border-box; }
input[type=text]::placeholder { color: #5D5B68; }
input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
input.code { font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .3em; font-weight: 700; }
button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; border: 1.5px solid var(--line); padding: 12px 16px; color: var(--ink); background: var(--raise); }
button:hover:not(:disabled) { border-color: #3A3A47; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 24px -8px var(--glow); }
button.primary:hover:not(:disabled) { border-color: #FFD27A; background: #FFC75A; }
button.ghost { background: transparent; }
button.danger { background: var(--mask); border-color: var(--mask); color: #1A0510; }
button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--mask); font-weight: 700; font-size: .9rem; }
a.btn { font-weight: 700; text-align: center; text-decoration: none; border-radius: 10px; border: 1.5px solid var(--line); padding: 12px 16px; color: var(--ink); background: var(--raise); }
a.btn:hover { border-color: #3A3A47; }
a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.linkbox { font-family: var(--f-mono) !important; font-size: .8rem !important; color: var(--muted) !important; }
.invite { background: rgba(245,184,61,.1); border: 1px solid rgba(245,184,61,.4); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.invite b { color: var(--accent); font-family: var(--f-mono); letter-spacing: .15em; }

/* Home */
.brand { display: flex; flex-direction: column; gap: 10px; padding: 14px 0 6px; }
.brand .logo { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 46px; height: 46px; flex: none; }
.brand h1 .c { color: var(--accent); }
.modes { display: grid; gap: 12px; }
.mode-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .8rem; }
.divider::before, .divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.rules { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; font-size: .9rem; align-items: baseline; }
.tag { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px;
  border: 1px solid currentColor; color: var(--muted); white-space: nowrap; line-height: 1.3; }
.tag.civil { color: var(--civil); }
.tag.uc { color: var(--mask); }
.tag.ghost { color: var(--ghost); }
.tag.host { color: var(--accent); }

/* Room bar */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar .code { font-family: var(--f-mono); font-weight: 700; letter-spacing: .22em; font-size: 1.05rem; color: var(--ink); }
.bar button { padding: 7px 12px; font-size: .85rem; }
.bigcode { font-family: var(--f-mono); font-weight: 700; font-size: 2.6rem; letter-spacing: .32em; color: var(--accent); text-shadow: 0 0 28px var(--glow); }

/* Players */
.players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.players li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.players li:first-child { border-top: 0; }
.players .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.players .x { padding: 4px 10px; font-size: .8rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--civil); box-shadow: 0 0 10px var(--civil); flex: none; }
.dot.off { background: #4A4855; box-shadow: none; }

/* Settings */
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .settings { grid-template-columns: 1fr; } }
.set { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 6px; }
.set .ctl { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.set .val { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.set button { width: 38px; height: 38px; padding: 0; font-size: 1.2rem; line-height: 1; }
.set .hint { font-size: .78rem; color: var(--muted); }

/* Secret word slip: deliberately small */
.slip { align-self: flex-start; width: 100%; max-width: 260px; border: 1.5px dashed #3A3A46; background: var(--surface); border-radius: 12px;
  padding: 11px 15px; text-align: left; display: flex; flex-direction: column; gap: 2px; font-weight: 400; }
.slip .word { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.slip.hidden .word { letter-spacing: .25em; color: #4D4B58; }
.slip.shown { border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(245,184,61,.08), 0 10px 30px -12px var(--glow); }
.slip.shown .word { color: var(--accent); }
.slip.ghostslip.shown { border-color: var(--ghost); box-shadow: 0 0 0 4px rgba(171,156,255,.08); }
.slip.ghostslip.shown .word { color: var(--ghost); }
.slip .sub { font-size: .76rem; color: var(--muted); }

.status { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.status .label b { color: var(--ink); }

/* Pass the device */
.pass { text-align: center; padding: 30px 18px; align-items: center; }
.pass .who { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.8rem, 8vw, 2.4rem); color: var(--accent); overflow-wrap: anywhere; }
.pass .slip { align-self: center; text-align: center; align-items: center; }
.progress { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.progress i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.progress i.done { background: var(--accent); }

/* Clue board */
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.board li { display: grid; grid-template-columns: minmax(80px, 34%) 1fr; gap: 10px; align-items: baseline; padding: 9px 11px; border-radius: 10px; background: var(--bg); border: 1px solid transparent; }
.board li.turn { border-color: var(--accent); box-shadow: 0 0 22px -10px var(--glow); }
.board li.out { opacity: .5; }
.board li.out .who { text-decoration: line-through; }
.board .who { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.board .clues { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.board .clue { font-family: var(--f-mono); font-size: .85rem; font-weight: 500; background: var(--raise); padding: 1px 8px; border-radius: 6px; overflow-wrap: anywhere; }
.board .clue.now { background: rgba(245,184,61,.14); color: var(--accent); }
.board .pending { color: var(--muted); font-size: .85rem; }

/* Votes */
.votes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.votes button { text-align: left; background: var(--bg); overflow-wrap: anywhere; display: flex; justify-content: space-between; gap: 6px; }
.votes button.mine { border-color: var(--mask); color: var(--mask); box-shadow: 0 0 20px -8px var(--mask); }
.votes .n { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }

.reveal { text-align: center; padding: 28px 18px; align-items: center; }
.reveal .big { font-family: var(--f-display); font-size: clamp(1.5rem, 7vw, 2rem); font-weight: 900; overflow-wrap: anywhere; }
.win-civils { color: var(--civil); text-shadow: 0 0 30px rgba(63,216,174,.3); }
.win-imposteurs { color: var(--mask); text-shadow: 0 0 30px rgba(255,77,141,.3); }
.win-ghost { color: var(--ghost); text-shadow: 0 0 30px rgba(171,156,255,.3); }

.words { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .words { grid-template-columns: 1fr; } }
.words div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
.words b { font-family: var(--f-display); display: block; overflow-wrap: anywhere; }
.words .c b { color: var(--civil); } .words .u b { color: var(--mask); } .words .g b { color: var(--ghost); }

.scores { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.scores li { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.scores li:last-child { border-bottom: 0; }
.scores .rank { font-family: var(--f-mono); color: var(--muted); width: 2ch; }
.scores .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.scores .pts { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.scores li.first .pts, .scores li.first .rank, .scores li.first .name { color: var(--accent); }

@media (prefers-reduced-motion: no-preference) {
  .slip, button { transition: border-color .15s, background-color .15s, box-shadow .2s, transform .1s; }
  button:active:not(:disabled) { transform: scale(.98); }
  .screen { animation: rise .28s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
.netbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: rgba(255,77,141,.1); border: 1px solid rgba(255,77,141,.45); border-radius: 10px; padding: 8px 10px 8px 14px; font-size: .9rem; }
.netbar button { padding: 7px 12px; font-size: .85rem; }
.themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .themes { grid-template-columns: 1fr; } }
.theme { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 11px 13px; background: var(--bg); font-weight: 400; }
.theme b { font-family: var(--f-display); font-size: .95rem; }
.theme span { font-size: .78rem; color: var(--muted); }
.theme.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.theme.on b { color: var(--accent); }
.theme:disabled { opacity: 1; cursor: default; }
.theme:disabled:not(.on) { opacity: .5; }
.order { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 1.05rem; }
.order li::marker { color: var(--accent); font-family: var(--f-mono); }
.slip.withpic { flex-direction: row; align-items: center; gap: 12px; }
.slip .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pic { width: 52px; height: 52px; flex: none; border-radius: 10px; object-fit: cover; background: var(--raise); }
.pic.emoji { display: grid; place-items: center; font-size: 1.8rem; line-height: 1; }
.words .pic { width: 44px; height: 44px; margin-bottom: 6px; }
.pass .slip.withpic { text-align: left; }
.timer { font-family: var(--f-mono); font-weight: 700; font-size: 1.1rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--mask); }
.timebar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.timebar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .25s linear; }
.timebar i.low { background: var(--mask); }
.credits { font-size: .75rem; color: var(--muted); text-align: center; padding-top: 8px; line-height: 1.6; }
.credits a { color: var(--muted); }
.src { display: block; font-size: .7rem; color: var(--muted); margin-top: 2px; }
.chat { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
.chat li { background: var(--bg); border-radius: 10px; padding: 7px 11px; display: flex; flex-direction: column; min-width: 0; }
.chat li b { font-size: .78rem; color: var(--accent); }
.chat li.me b { color: var(--civil); }
.chat li span { overflow-wrap: anywhere; }
.chat li.empty { color: var(--muted); font-size: .85rem; background: transparent; padding-left: 0; }
.reacts { display: flex; gap: 6px; flex-wrap: wrap; }
.reacts button { padding: 6px 10px; font-size: 1.2rem; line-height: 1; background: var(--bg); }
.fx { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 50; pointer-events: none; display: flex; flex-direction: column; align-items: center;
  animation: floatup 2.6s ease-out forwards; }
.fx .e { font-size: 2.4rem; line-height: 1; }
.fx .n { font-size: .72rem; font-weight: 700; background: var(--raise); color: var(--ink); padding: 1px 7px; border-radius: 99px; margin-top: 2px; }
@keyframes floatup { 0% { transform: translateY(20px) scale(.6); opacity: 0; } 15% { transform: translateY(0) scale(1.1); opacity: 1; } 100% { transform: translateY(-260px) scale(1); opacity: 0; } }
.vreveal { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.vreveal li { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; background: var(--bg); border-radius: 10px; padding: 8px 12px;
  animation: dropin .4s ease-out both; }
.vreveal li span, .vreveal li b { overflow-wrap: anywhere; min-width: 0; }
.vreveal li b { color: var(--mask); text-align: right; }
.vreveal .arrow { color: var(--muted); }
@keyframes dropin { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
.pairform { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pairform #pairH, .pairform button { grid-column: 1 / -1; }
@media (max-width: 420px) { .pairform { grid-template-columns: 1fr; } }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; font-weight: 400; background: var(--bg); }
.toggle > span { display: flex; flex-direction: column; gap: 2px; }
.toggle b { font-family: var(--f-display); font-size: .95rem; }
.toggle > span > span { font-size: .78rem; color: var(--muted); }
.toggle i { width: 42px; height: 24px; border-radius: 12px; background: var(--line); position: relative; flex: none; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.toggle.on { border-color: var(--accent); }
.toggle.on i { background: rgba(245,184,61,.35); }
.toggle.on i::after { left: 21px; background: var(--accent); }
.invite b.plain { font-family: inherit; letter-spacing: 0; }
@media (prefers-reduced-motion: reduce) { .fx, .vreveal li { animation-duration: .01s; } }
.special { display: flex; gap: 12px; align-items: center; background: rgba(171,156,255,.1); border: 1px solid rgba(171,156,255,.45); border-radius: 12px; padding: 10px 14px; }
.special .icon { font-size: 1.5rem; line-height: 1; font-weight: 700; color: var(--ghost); }
.special > span:last-child { display: flex; flex-direction: column; gap: 1px; }
.special b { font-family: var(--f-display); font-size: .9rem; color: var(--ghost); }
.special span span { font-size: .82rem; color: var(--muted); }
.traitor { font-size: .8rem; color: var(--mask); font-weight: 700; margin-top: 4px; }
.toggle:disabled { opacity: 1; cursor: default; }
.freqs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 420px) { .freqs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.freq { padding: 9px 4px; font-size: .82rem; background: var(--bg); }
.freq.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.freq:disabled { opacity: 1; cursor: default; }
.freq:disabled:not(.on) { opacity: .5; }
.barbtns { gap: 8px; flex-wrap: nowrap; }
.x.danger-soft { border-color: var(--mask); color: var(--mask); }
.set > button.ghost { width: auto; height: auto; margin-top: 4px; padding: 8px 12px; font-size: .85rem; }
.chat li.sep { background: transparent; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; text-align: center; padding: 4px 0; }
.topbtns { gap: 8px; }
.champion { color: var(--accent); text-shadow: 0 0 30px var(--glow); }
</style>

<script>
// [mot des civils, mot de la taupe, indice large pour le fantôme]
const THEMES = {

  ["Mario","Sonic","jeu vidéo"],["Piano","Orgue","musique"],["Tennis","Badminton","sport"],["Basket","Volley","sport"],

// Look for the host on each relay in turn: its retained "online" message arrives right after subscribing.
async function joinRoom(code, name) {
  if (!window.mqtt) { S.err = "Le module de connexion n'a pas chargé. Vérifie ta connexion internet."; render(); return; }
  closeNet();
  S.mode = "guest"; S.code = code; S.net = "connecting"; S.err = ""; S.room = null;
  lsSet("uc_guest", code); render();
  const order = [S.brokerHint, ...BROKERS.keys()].filter((v, i, a) => v != null && v < BROKERS.length && a.indexOf(v) === i);
  let found = null;
  for (const i of order) {
    const c = await connectTo(i, { topic: NS + code + "/act", payload: JSON.stringify({ t: "bye", uid: S.uid }), retain: false, qos: 1 });
    if (S.mode !== "guest" || S.code !== code) { try { c && c.end(true); } catch {} return; }
    if (!c) continue;
    const ok = await new Promise(res => {
      const t = setTimeout(() => res(false), 4000);
      c.on("message", (tp, buf) => { const m = parse(buf); if (tp === NS + code + "/host" && m && m.on) { clearTimeout(t); res(true); } });
      c.subscribe(NS + code + "/host", { qos: 1 });
    });
    if (ok) { found = c; break; }
    try { c.end(true); } catch {}
  }
  if (S.mode !== "guest" || S.code !== code) return;
  if (!found) {
    S.net = "waiting"; S.err = ""; render();
    setTimeout(() => { if (S.mode === "guest" && S.code === code && S.net === "waiting") joinRoom(code, name); }, 5000);
    return;
  }
  const c = found;
  wire(c, (t, m) => {
    if (t === topic("fx")) { showReaction(m); return; }
    if (t === topic("tick")) { if (m && m.key) S.deadline = { key: m.key, at: Date.now() + (+m.left || 0) }; return; }
    if (t === topic("host")) {
      if (!m || !m.on) { S.net = "hostaway"; render(); }
      else if (S.net === "hostaway" || S.net === "lost") { S.net = "ok"; S.err = ""; hello(); render(); }
      return;
    }
    if (t !== topic("p", S.uid) || !m) return;
    if (m.t === "state") { S.room = m.s; S.net = "ok"; render(); }
    else if (m.t === "err") { S.err = m.m; render(); }
    else if (m.t === "kicked") { leave(); S.err = "L'hôte t'a retiré·e du salon."; render(); }
  });
  const hello = () => pub(topic("act"), { t: "hello", uid: S.uid, name }, false);
  c.subscribe([topic("p", S.uid), topic("tick"), topic("fx")], { qos: 1 }, hello);
  c.on("connect", () => { if (S.client === c) { S.net = "ok"; c.subscribe([topic("p", S.uid), topic("host"), topic("tick"), topic("fx")], { qos: 1 }, hello); render(); } });
  S.net = "ok"; keepAwake(); render();
}
function closeNet() {
  const c = S.client; S.client = null;
  if (c) { try { c.end(true); } catch {} }
}
function leave() {
  const c = S.client;
  if (S.mode === "guest" && c?.connected) pub(topic("act"), { t: "act", uid: S.uid, a: { type: "leave" } }, false);
  if (S.mode === "host" && c?.connected && G) {
    pub(topic("host"), null, true);
    Object.keys(G.players).forEach(uid => { if (uid !== G.host) pub(topic("p", uid), null, true); });
  }
  if (S.mode === "host") lsSet("uc_hostgame", "");
  if (S.mode === "guest") lsSet("uc_guest", "");
  if (S.mode === "local") lsSet("uc_local", "");
  S.client = null;
  if (c) setTimeout(() => { try { c.end(); } catch {} }, 400);

let lastScreen = "";
function render() {
  const keep = ["pseudo", "joinCode", "clueInput", "guessInput", "newPlayer", "chatInput", "pairA", "pairB", "pairH"].map(id => {
    const el = document.getElementById(id); return el ? [id, el.value, document.activeElement === el, el.selectionStart] : null;
  }).filter(Boolean);
  let html, screen;
  if (!S.mode) { html = viewHome(); screen = "home"; }
  else if (!S.room) {
    screen = "wait";
    html = S.net === "waiting" ? `${bar()}<div class="panel reveal stack"><p class="big">En attente de l'hôte…</p>
      <p class="muted">Le salon ${esc(S.code)} n'est pas ouvert pour l'instant. Nouvel essai toutes les 5 secondes : dès que l'hôte revient, tu rejoins automatiquement.</p>
      <div class="row"><button class="ghost" data-a="leave">Retour</button></div></div>`
      : `${bar()}<div class="panel reveal stack"><p class="big">${S.net === "lost" ? "Pas de connexion" : "Connexion au salon…"}</p>
      ${S.net === "lost" ? `${errLine()}<div class="row"><button class="primary" data-a="reconnect">Réessayer</button><button class="ghost" data-a="leave">Retour</button></div>` : `<p class="muted">Salon ${esc(S.code)}</p>`}</div>`;
  } else {
    screen = S.room.status + (S.room.status === "deal" ? S.room.deal + "" + S.dealReady : "");
    if (S.peek && (!isLocal() || !["clues", "vote", "result"].includes(S.room.status))) S.peek = null;
    if (S.peek) screen = "peek" + S.peek.step;
    if (S.editing && (!isHost() || S.room.status === "lobby")) S.editing = false;
    if (S.editing) screen = "edit";
    html = S.editing ? viewEdit() : S.peek ? viewPeek() : ({ lobby: viewLobby, deal: viewDeal, clues: viewClues, vote: viewVote, result: viewResult, ghostGuess: viewGhostGuess, roundEnd: viewRoundEnd, final: viewFinal }[S.room.status] || viewLobby)();

  if (screen !== lastScreen) { app.classList.remove("screen"); void app.offsetWidth; app.classList.add("screen"); window.scrollTo(0, 0); }

    if (focused) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
  });
}

  reconnect: () => S.code && joinRoom(S.code, S.pseudo || "Joueur"),

  mime: () => send({ type: "mime" }),

  },
  editOpen: () => { S.editing = true; S.err = ""; render(); },
  editClose: () => { S.editing = false; S.err = ""; render(); },

  peekClose: () => { S.peek = null; S.revealed = false; render(); },
  theme: el => send({ type: "theme", value: el.dataset.v }),
  vote: el => { if (isLocal()) { S.pick = S.pick === el.dataset.u ? null : el.dataset.u; render(); } else send({ type: "vote", target: el.dataset.u }); },
  confirmVote: () => { const t = S.pick; S.pick = null; if (t) send({ type: "eliminate", target: t }); },
  resolve: () => send({ type: "resolve" }),
  guess: () => { const g = takeInput("guessInput"); if (g) send({ type: "guess", guess: g }); },
  continue: () => send({ type: "continue" }),
  next: () => send({ type: "next" }),
  newGame: () => send({ type: "newGame" }),
  replay: () => send({ type: "replay" }),
  copyLink: async () => {
    try { await navigator.clipboard.writeText(inviteText()); S.copied = true; render(); setTimeout(() => { S.copied = false; render(); }, 2000); }
    catch { const el = document.getElementById("inviteLink"); if (el) { el.focus(); el.select(); } }
  },
  share: async () => { try { await navigator.share({ title: "Taupe", text: `Rejoins ma partie de Taupe ! Salon ${S.code}`, url: inviteLink() }); } catch {} },
};
// Countdown display, updated in place so typing is never interrupted.
setInterval(() => {
  const el = document.getElementById("turnTimer"), bar = document.getElementById("turnBar");
  if (!el) return;
  const left = turnLeft();
  if (bar) bar.parentElement.hidden = left == null;
  if (left == null) { el.textContent = ""; return; }
  const sec = Math.max(0, Math.ceil(left / 1000));
  el.textContent = sec + " s"; el.classList.toggle("low", sec <= 10);
  if (bar) { bar.style.width = Math.max(0, Math.min(100, left / turnMs(S.room) * 100)) + "%"; bar.classList.toggle("low", sec <= 10); }
  // Out of time: send what the player already typed rather than losing it.
  const key = turnKey(S.room), input = document.getElementById("clueInput");
  if (left <= 300 && input && input.value.trim() && S.autoSent !== key) { S.autoSent = key; ACTIONS.clue(); }
}, 250);
app.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  ACTIONS[el.dataset.a]?.(el);
});
app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const a = e.target.dataset?.enter; if (a) { e.preventDefault(); ACTIONS[a]?.(e.target); }
});

function loadSaved() {
  try { const l = JSON.parse(lsGet("uc_local") || "null"); S.savedLocal = l && l.status && l.status !== "final" ? l : null; } catch { S.savedLocal = null; }
  try { const h = JSON.parse(lsGet("uc_hostgame") || "null"); S.savedHost = h && h.G && Date.now() - h.at < 6 * 3600e3 ? h : null; } catch { S.savedHost = null; }
}
loadSaved();
const qRoom = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
S.prefill = /^[A-Z]{4}$/.test(qRoom) ? qRoom : "";
const qB = parseInt(new URLSearchParams(location.search).get("b") || "", 10);
S.brokerHint = Number.isInteger(qB) ? qB : null;
render();
(function autoResume() {
  const savedGuest = lsGet("uc_guest");
  if (S.savedHost && S.pseudo && (!S.prefill || S.prefill === S.savedHost.G.code)) { hostRoom(S.pseudo, S.savedHost.G); return; }
  if (savedGuest && S.pseudo && (!S.prefill || S.prefill === savedGuest)) joinRoom(savedGuest, S.pseudo);
})();
</script>
